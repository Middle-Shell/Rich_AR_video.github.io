<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content='width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=yes'>
    <title>Unity WebGL Player | Rich_AR</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap" rel="stylesheet">
    <style>
        html{
            height: -webkit-fill-available;
        }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #032E50;
            overflow: hidden;
        }
        .ctaDiv {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #fffa;
            z-index: 99;
        }
        #startARDiv {
    /* 🌆 Фоновая картинка */
        background: url('TemplateData/background.png') no-repeat center center;
        background-size: cover; /* Растянуть по экрану */
        background-color: #0a3d62; /* fallback цвет */
    font-family: 'Montserrat', sans-serif; /* шрифт Montserrat */
    font-weight: 300; /* Regular */
    font-size: 1.2em;   /* оставляем текущий размер */
    color: white;     /* белый текст */
    text-align: center;
    line-height: 1.4em;
}
#logoDiv {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 100;
        pointer-events: none;
        color: white;
        font-family: 'Montserrat', sans-serif; /* теперь Montserrat */
    }
    #logoDiv img {
    display: block;
    margin: 0 auto;
    height: 60px;   /* уменьшили с auto на фиксированную высоту */
    width: auto;    /* чтобы сохранить пропорции */
    user-select: none;
}
    #logoSubtitle {
    margin-top: 10px;
    font-size: 1.5em;       /* размер оставляем тот же или уменьшаем */
    font-weight: 300;     /* Regular */
    letter-spacing: 0.8px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    color: white;
    width: 80vw;          /* теперь текст занимает почти всю ширину экрана */
    max-width: 600px;    /* при желании, ограничение на большой экран */
    text-align: center;   /* выравнивание по центру */
    margin-left: auto;    /* центрирование блока */
    margin-right: auto;
}
    </style>
</head>
<body>
    <div id="logoDiv">
        <img src="TemplateData/Logo.png" alt="Logo">
        <p id="logoSubtitle">ЕСТЬ ВЕЩИ,<br>КОТОРЫЕ ЛУЧШЕ<br>ОДИН РАЗ УВИДЕТЬ</p>
    </div>
    <!--IMAGETARGETS-->
        <imagetarget id='Tracker' src='targets/Tracker.jpg'></imagetarget>
    <video id="webcam-video" muted autoplay playsinline style="width:1px;position:absolute"></video>
    <!-- <video id="webcam-video" muted autoplay playsinline style="width:100%; height:100%; object-fit:cover; position:absolute"></video> -->
    <canvas id="video-canvas" style="width:100%; height:100%; object-fit:cover; position:absolute"></canvas>
    <div id="startARDiv" class="ctaDiv">
    <p style="
    position: fixed;      /* фиксируем относительно экрана */
    bottom: 75px;
        text-align: center;
        width: 65vw;
        font-family: 'Montserrat', sans-serif; /* шрифт Montserrat */
        font-weight: 400; /* Regular */
        font-size: 0.9em; /* текущий размер оставляем */
        line-height: 1.4em;
        color: white;
    ">
        Отсканируйте страницу в меню, чтобы картинка ожила
    </p>
    <button id="startARButton" onclick="StartAR()" style="
    position: fixed;      /* фиксируем относительно экрана */
    bottom: 40px;
        display: none;
        background-color: transparent;   /* прозрачная */
        color: white;                    /* белый текст */
        border: 2px solid white;         /* белая рамка */
        border-radius: 0px;              /* прямоугольная */
        padding: 10px 20px;              /* внутренние отступы */
        font-size: 1em;
        font-family: 'Montserrat', sans-serif; /* шрифт Montserrat */
        font-weight: 400; /* Regular */
        cursor: pointer;
    ">
        Продолжить
    </button>
</div>
    <div id="screenshotDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25);">
            <img id="screenshotImg" src="" alt="screenshot" style="width:80vw; height:80vh">
            <button onclick="document.getElementById('screenshotDiv').style.display = 'none';" style="position:absolute; transform:translateY(-100%); right:0; top:0">Close</button>
        </div>
    </div>
    <div id="confirmUrlDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25); width: 80vw; display:flex; flex-direction: column; align-items: center;">
            <p id="confirmUrlText" style="text-align: center; width:80%; overflow: hidden; text-overflow: ellipsis;">Are you sure you want to visit url.com?</p>
            <div>
                <button onclick="window.open(newUrlString, '_blank').focus(); document.getElementById('confirmUrlDiv').style.display = 'none'">VISIT SITE</button>
                <button onclick="document.getElementById('confirmUrlDiv').style.display = 'none'">GO BACK</button>
            </div>
        </div>
    </div>
    <div id="errorDiv" class="ctaDiv" style="display: none; background:#aaa">
        <p id="errorText" style="text-align: center; width:60vw; color:white"></p>
    </div>
    <div id="unity-container" class="unity-mobile">
        <canvas id="unity-canvas" style="width: 100%; height: 100%; background: #0000; z-index: -99"></canvas>
        <div id="unity-loading-bar" style="
        position: fixed;
        top: 0; left:35%; width: 0vw; height: 00vh;
        z-index: 9999;
        display: none;
        background-color: #032E50;
        margin: 0;
        padding: 0;
    ">
        <video
            id="loading-video"
            preload="auto"
            autoplay
            muted
            playsinline
            style="
                position: absolute;
                top: 0; left: 0;
                width: 720px;
                height: 1280px;
                object-fit: cover;
                margin: 0;
                padding: 0;
                "
        >
            <source src="video/water-fill.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
        <canvas id="video-canvas"></canvas>
    </div>
    <script src="arcamera.js" type="text/javascript"></script>
    <script src="itracker.js" type="text/javascript"></script>
    <script src="Build/Rich_AR_video.github.io.loader.js"></script>
    <script>
           var loadingVideo;
var videoDuration = 0; // Will store the video's total duration once loaded
var initialize = async() =>{
               var unityCanvas = document.querySelector("#unity-canvas");
               var videoCanvas = document.querySelector("#video-canvas");
               window.arCamera = new ARCamera(unityCanvas, videoCanvas);
               window.iTracker = new ImageTracker(arCamera);
               try{
                   await window.iTracker.initialize();
                   console.log("ImageTracker initialized!");
               }
               catch{
                   console.error("Failed to initialize ImageTracker. Are you missing opencv.js? " + error);
                   ShowError("Failed to initialize the experience.");
                   return;
               }
              
               await LoadWebcams();
               document.getElementById("startARButton").style.display = "block";
           }
           initialize();
           var container = document.querySelector("#unity-container");
           var canvas = document.querySelector("#unity-canvas");
           var loadingBar = document.querySelector("#unity-loading-bar");
           var progressBarFull = document.querySelector("#unity-progress-bar-full");
           function StartAR() {
                loadingBar.style.display = "block";
               document.getElementById("logoDiv").style.display = "none";
              
               canvas.style.width = window.innerWidth + "px";
               canvas.style.height = window.innerHeight + "px";
              
               document.getElementById("startARDiv").style.display = "none";
               // Show the loading bar first
               loadingBar.style.display = "flex"; /* Show after button press */
               console.log("Loading bar displayed"); // Debug log
               // Setup video inside StartAR for fresh load
               loadingVideo = document.getElementById("loading-video");
               const prepareLoadingVideo = () => {
                   videoDuration = loadingVideo.duration || 0;
                   loadingVideo.currentTime = 0;
                   const playPromise = loadingVideo.play();
                   if (playPromise !== undefined) {
                       playPromise.catch(err => console.warn("Loading video play prevented:", err));
                   }
                   console.log("Loading video ready with duration: " + videoDuration + " seconds");
               };
               if (loadingVideo.readyState >= 1) {
                   prepareLoadingVideo();
               } else {
                   loadingVideo.addEventListener('loadedmetadata', prepareLoadingVideo, { once: true });
               }
               loadingVideo.load(); // Force reload here
               console.log("Video load triggered"); // Debug log
               createUnityInstance(document.querySelector("#unity-canvas"), {
                   dataUrl: "Build/Rich_AR_video.github.io.data",
                   frameworkUrl: "Build/Rich_AR_video.github.io.framework.js",
                   codeUrl: "Build/Rich_AR_video.github.io.wasm",
                   streamingAssetsUrl: "StreamingAssets",
                   companyName: "VVARP",
                   productName: "Rich_AR",
                   productVersion: "0.1.0",
                   //webglContextAttributes: { "preserveDrawingBuffer": true },
                   // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
                   // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
                   },
                   (progress) => {
                       let percentage = Math.floor(progress * 100);
    // Removed updating the percentage text since we hid the div
    console.log("Progress: " + percentage + "%"); // Debug log
    
    // Sync video seek if video is ready (check readyState)
    if (loadingVideo && videoDuration > 0 && loadingVideo.readyState >= 2) {
        let targetTime = (percentage / 100) * videoDuration;
        loadingVideo.currentTime = targetTime; // Seek to the corresponding time
        console.log("Video seek to: " + targetTime); // Debug log
    }
                   }
               ).then((unityInstance) => {
                   window.unityInstance = unityInstance;
                   RequestWebcam();
                   loadingBar.style.display = "none";
                   
    // Optionally hide the video when loading completes
    if (loadingVideo) {
        loadingVideo.style.display = 'none';
    }
               });
           }
           //Set Facing Mode here ('environment', 'user', '')
        window.unityFacingMode = "environment"
           window.WEBCAM_SETTINGS = {
               video: {
                   facingMode: unityFacingMode,
               },
               audio: false
           };
           window.requestingForPermissions = false;
           async function RequestWebcam(){
               window.requestingForPermissions = true;
               try{
                   window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                   console.log("Webcam access granted");
                   requestingForPermissions = false;
               }
               catch (err) {
                   //user denied camera permission - show error panel
                   console.error("getUserMedia error - " , err);
                   ShowError("Failed to start the experience. Camera permission was denied");
                   window.requestingForPermissions = false;
               }          
           }
           async function StartWebcam(){
               console.log("StartWebcam")
               while (window.requestingForPermissions) {
                   // Wait until requestingForPermissions becomes true.
                   console.log("Waiting for permissions...");
                   await new Promise(resolve => setTimeout(resolve, 100)); // Adjust the delay time as needed.
               }
               console.log("Got Permissions");
               if(window.webcamStream)
               {
                   const video = document.querySelector("#webcam-video");
                   video.srcObject = webcamStream;
                   try {
                       await arCamera.startWebcam(video);
                       console.log("Webcam started successfully");
                       window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamSuccess');
                   }
                   catch(err){
                       console.error("Webcam failed to start - ", err);
                       window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
                   }  
               }
               else{
                   console.error("Webcam failed to start - permission not yet granted");
                   window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
               }  
           }
           async function LoadWebcams() {
    // Получаем список видеоустройств
    const devices = await navigator.mediaDevices.enumerateDevices();
   
    // Ищем первую "заднюю" камеру
    const backCam = devices.find(device =>
        device.kind === 'videoinput' &&
        !device.label.toLowerCase().includes('front') // не фронтальная
    );
    if (backCam) {
        // Сохраняем deviceId в глобальные настройки
        window.WEBCAM_SETTINGS.video = { deviceId: backCam.deviceId, facingMode: 'environment' };
        iTracker.WEBCAM_NAME = backCam.label || "Back Camera";
        return backCam;
    } else {
        // Если не нашли, просто используем facingMode environment
        window.WEBCAM_SETTINGS.video = { facingMode: 'environment' };
        iTracker.WEBCAM_NAME = "Back Camera";
        return null;
    }
}
           async function FlipCam(){
               arCamera.stopWebcam();
               window.WEBCAM_SETTINGS.video.deviceId = '';
               if(window.WEBCAM_SETTINGS.video.facingMode == 'user'){
                   window.WEBCAM_SETTINGS.video.facingMode = 'environment';
                   arCamera.setFlipped(false);
               }
               else{
                   window.WEBCAM_SETTINGS.video.facingMode = 'user';
                   arCamera.setFlipped(true);
               }
               window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
               const video = document.querySelector("#webcam-video");
               video.srcObject = webcamStream;
               await arCamera.startWebcam(video);
           }
           function ShowError(error){
               document.getElementById("errorDiv").style.display = "flex";
               document.getElementById("errorText").innerHTML = error;
           }
           function ShowScreenshot(dataUrl){
               document.getElementById("screenshotDiv").style.display = "flex";
               document.getElementById("screenshotImg").src = dataUrl;
               document.getElementById("screenshotImg").style.width = "80vw";
               document.getElementById("screenshotImg").style.height = 80 / window.innerWidth * window.innerHeight + "vw";
           }
           function ShowConfirmUrl(url){
               document.getElementById("confirmUrlDiv").style.display = "flex";
               window.newUrlString = url;
               document.getElementById("confirmUrlText").innerText = "Are you sure you want to visit " + url;                
           }
           window.ITRACKER_GLOBALS = {
               //place global settings here
               INTERNAL_SMOOTHFACTOR_POS: .075,
           }
          
    </script>
</body>
</html>
